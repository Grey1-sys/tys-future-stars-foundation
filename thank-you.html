<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank you — Ty's Future Stars Foundation</title>
<meta name="description" content="Thank you for getting in touch with Ty's Future Stars Foundation.">
<!-- A form-submission landing page has no business in search results. -->
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>
<div id="site-header"></div>

<main id="main">

<!-- Fallback landing page for a form POST when JavaScript is not
     available. With JS the form swaps itself for the same message in
     place and nobody ever lands here. -->
<section class="section">
  <div class="wrap narrow center">
    <span class="thanks-ic">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
    </span>
    <h1 class="display mt-2">Thank you.</h1>
    <p class="lede mt-2 thanks-lede">We have your details. Someone from Ty's Future Stars
      Foundation will follow up within 2 business days.</p>
    <p class="muted mt-2">Nothing arrived? Email
      <a href="mailto:hello@tysfuturestars.org">hello@tysfuturestars.org</a>
      and we will pick it up from there.</p>

    <div class="hero-actions thanks-actions">
      <a href="index.html" class="btn btn-secondary">Back to home</a>
      <a href="programs.html" class="btn btn-ghost">See our programs</a>
    </div>
  </div>
</section>

</main>

<div id="site-footer"></div>

<script src="assets/site.js"></script>
<script src="assets/main.js"></script>
</body>
</html>
