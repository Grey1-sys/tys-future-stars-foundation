# =====================================================================
# Sveltia CMS - Ty's Future Stars Foundation
# =====================================================================
# Saving in the CMS commits to `main` and Netlify redeploys. There is
# no separate publish step: save IS publish, live in about a minute.
#
# STRUCTURE
#   Every file in /data is shaped { "items": [ ... ] }, so each
#   collection here is a FILE collection holding one `items` list.
#   A bare top-level array has no key for a list widget to attach to.
#
# CHANGING THIS FILE
#   Field names must match the JSON in /data exactly. If they disagree
#   the website quietly stops reading that value. Schemas are in
#   CLAUDE.md.
#
#   The PAGE COPY section at the bottom is generated by
#   tools/build-cms-config.js. Do not hand-edit between its markers.
#
# WRITING hint: TEXT
#   Every hint is read by someone who has never used a CMS, often on a
#   phone, at night. Say what the field does and what goes wrong if it
#   is wrong. Never assume the words "slug", "field" or "publish".
# =====================================================================

backend:
  name: github
  repo: Grey1-sys/tys-future-stars-foundation
  branch: main
  commit_messages:
    create: Add {{collection}} "{{slug}}" (via CMS)
    update: Update {{collection}} "{{slug}}" (via CMS)
    delete: Delete {{collection}} "{{slug}}" (via CMS)
    uploadMedia: Upload {{path}} (via CMS)
    deleteMedia: Delete {{path}} (via CMS)
local_backend: true
media_folder: assets/images
public_folder: assets/images
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2048
          height: 2048
        svg:
          optimize: true
max_file_size: 12000000
collections:
  - name: events
    label: Events
    description: >-
      Anything with a date. These show up on the What's Happening page, newest
      first, and move to "Recently" on their own once the date has passed.
    files:
      - name: events
        label: All events
        file: data/events.json
        fields:
          - name: items
            label: Events
            label_singular: Event
            widget: list
            required: false
            collapsed: true
            add_to_top: true
            summary: '{{title}} — {{date}}'
            fields:
              - name: published
                label: Show this on the website
                widget: boolean
                default: false
                hint: >-
                  Leave this OFF until every detail below is correct. An event
                  is a promise: a wrong address or time can send a family to
                  an empty parking lot. Turn it ON when you are ready for
                  people to see it.
              - name: id
                label: Short name for this entry
                widget: string
                pattern:
                  - ^[a-z0-9-]+$
                  - Lowercase letters, numbers and dashes only
                hint: >-
                  Lowercase with dashes, e.g. spring-classic-2026. This
                  becomes part of the event’s web address, so changing it
                  breaks any link already shared.
              - name: title
                label: Event name
                widget: string
                hint: >-
                  What you would call it on a flyer. Example: Spring Classic
                  Fundraiser.
              - name: date
                label: Date
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: false
                picker_utc: false
                hint: The day it starts.
              - name: endDate
                label: Last day
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: false
                picker_utc: false
                required: false
                hint: >-
                  Only needed if it runs across more than one day. A one-day
                  event can leave this the same as the date above.
              - name: time
                label: Time
                widget: string
                required: false
                hint: >-
                  Written however you would say it out loud. Example: 10:00 AM
                  – 4:00 PM.
              - name: locationName
                label: Place name
                widget: string
                required: false
                hint: 'The name of the venue. Example: Smyrna Community Center.'
              - name: address
                label: Street address
                widget: string
                required: false
                hint: >-
                  The full address. This becomes a tappable link that opens
                  Maps on a phone, so it needs to be the real, complete
                  address.
              - name: description
                label: One-line summary
                widget: text
                hint: >-
                  One sentence. This is what people see on the events list
                  before they tap through.
              - name: body
                label: Full description
                widget: text
                required: false
                hint: >-
                  The longer version, shown on the event's own page. Press
                  Enter twice to start a new paragraph.
              - name: whoItIsFor
                label: Who it is for
                widget: string
                required: false
                hint: >-
                  Example: Ages 9 to 16, all skill levels. Leave blank to hide
                  this line.
              - name: whatToBring
                label: What to bring
                widget: string
                required: false
                hint: >-
                  Example: Water bottle and indoor shoes. Leave blank to hide
                  this line.
              - name: cost
                label: Cost
                widget: string
                required: false
                hint: >-
                  Write "Free" if it is free. Otherwise write the price
                  exactly as people will pay it.
              - name: category
                label: Type of event
                widget: select
                options:
                  - Fundraiser
                  - Camp
                  - Clinic
                  - Community
                  - Program
                  - Celebration
                  - Other
                required: false
              - name: registrationUrl
                label: Sign-up link
                widget: string
                required: false
                pattern:
                  - ^$|^https?://
                  - Must start with https:// or be left empty
                hint: >-
                  Paste the full web address of wherever people sign up —
                  Eventbrite, a Google Form, anything. Leave it empty and the
                  page says registration details are coming, instead of
                  showing a button that goes nowhere.
              - name: registrationLabel
                label: Sign-up button wording
                widget: string
                required: false
                hint: >-
                  Leave blank for "Register". Or write your own, e.g. "Save my
                  seat".
              - name: metaDescription
                label: Google search description
                widget: text
                required: false
                hint: >-
                  One or two sentences Google shows under the link. Keep it
                  under about 150 characters.
              - name: image
                label: Photo
                widget: object
                required: false
                collapsed: false
                fields:
                  - name: src
                    label: Image file
                    widget: image
                    required: false
                    hint: >-
                      Landscape works best. Big photos are shrunk
                      automatically, so upload straight from your phone.
                  - name: alt
                    label: Describe this photo
                    widget: string
                    required: false
                    hint: >-
                      REQUIRED if you add a photo. Describe it for someone who
                      cannot see it — "Young players huddled around a coach at
                      centre court". Without this the photo will not appear at
                      all. That is deliberate.
              - name: featured
                label: Highlight this event
                widget: boolean
                default: false
                required: false
                hint: Adds an accent stripe so it stands out in the list.
  - name: posts
    label: Updates
    files:
      - name: posts
        label: All updates
        file: data/posts.json
        fields:
          - name: items
            label: Updates
            label_singular: Update
            widget: list
            required: false
            collapsed: true
            add_to_top: true
            summary: '{{title}} — {{date}}'
            fields:
              - name: published
                label: Show this on the website
                widget: boolean
                default: false
                hint: >-
                  Leave OFF while you are still writing. Turn ON to publish
                  it.
              - name: slug
                label: Web address name
                widget: string
                pattern:
                  - ^[a-z0-9-]+$
                  - Lowercase letters, numbers and dashes only — no spaces
                hint: >-
                  Lowercase words joined by dashes, e.g. spring-season-recap.
                  This becomes part of the link, so once people have shared
                  it, changing it breaks their link.
              - name: title
                label: Headline
                widget: string
              - name: date
                label: Date
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: false
                picker_utc: false
              - name: author
                label: Written by
                widget: string
                required: false
              - name: category
                label: Type
                widget: select
                options:
                  - News
                  - Announcements
                  - Impact
                  - Programs
                  - Events
                required: false
              - name: excerpt
                label: One-line summary
                widget: text
                hint: >-
                  One or two sentences shown on the list before people tap
                  through.
              - name: body
                label: The update itself
                widget: text
                hint: Press Enter twice between paragraphs.
              - name: metaDescription
                label: Google search description
                widget: text
                required: false
                hint: Under about 150 characters.
              - name: hero
                label: Photo
                widget: object
                required: false
                collapsed: false
                fields:
                  - name: src
                    label: Image file
                    widget: image
                    required: false
                  - name: alt
                    label: Describe this photo
                    widget: string
                    required: false
                    hint: REQUIRED if you add a photo, or it will not show at all.
              - name: tags
                label: Tags
                widget: list
                required: false
                hint: Optional keywords. One per line.
    description: >-
      Short news posts. These are the main reason Google has anything new to
      find on the site, so even three or four a year help.
  - name: stories
    label: Success stories
    files:
      - name: stories
        label: All success stories
        file: data/stories.json
        fields:
          - name: items
            label: Success stories
            label_singular: Story
            widget: list
            required: false
            collapsed: true
            add_to_top: true
            summary: '{{name}} — {{headline}}'
            fields:
              - name: published
                label: Show this on the website
                widget: boolean
                default: false
              - name: id
                label: Short name for this entry
                widget: string
                pattern:
                  - ^[a-z0-9-]+$
                  - Lowercase letters, numbers and dashes only
                hint: 'Just for filing, never shown. Example: jordan-2026.'
              - name: consent
                label: Has this person agreed to have their story published?
                widget: boolean
                default: false
                hint: >-
                  Only turn this ON if you have actually asked them and they
                  said yes. If this is OFF the story never appears anywhere on
                  the site, even if everything else is filled in.
              - name: isMinor
                label: Is this person under 18?
                widget: boolean
                default: false
                hint: Answer honestly. It changes what is required below.
              - name: mediaReleaseOnFile
                label: Do you have a SIGNED media release on file for them?
                widget: boolean
                default: false
                hint: >-
                  For anyone under 18 this must be ON, and it must be true — a
                  signed release physically in your files, from a parent or
                  guardian. A story about a minor without one will NOT appear
                  on the website. This is not a setting to tidy up later; it
                  is the protection for that child and for the foundation.
              - name: name
                label: Their name
                widget: string
                hint: >-
                  First name alone is fine, and is usually the kinder choice
                  for a young person.
              - name: ageOrRole
                label: Age or role
                widget: string
                required: false
                hint: 'Example: Age 16, or Parent, or Volunteer since 2024.'
              - name: programSlug
                label: Which program were they part of?
                widget: string
                required: false
                hint: >-
                  Use the program's web address name, e.g. future-stars. Links
                  the story to that program.
              - name: headline
                label: Headline
                widget: string
              - name: excerpt
                label: Short version
                widget: text
                hint: >-
                  Two lines, shown on the card before people open the full
                  story.
              - name: body
                label: The full story
                widget: text
                hint: In their words wherever you can.
              - name: pullQuote
                label: A quote from them
                widget: text
                required: false
                hint: >-
                  Only a quote you actually have on record. Never write one on
                  their behalf.
              - name: photo
                label: Their photo
                widget: object
                required: false
                collapsed: false
                fields:
                  - name: src
                    label: Image file
                    widget: image
                    required: false
                    hint: >-
                      Only if the media release covers photographs. If you are
                      not certain, leave it empty — the story reads fine
                      without one.
                  - name: alt
                    label: Describe this photo
                    widget: string
                    required: false
    description: >-
      Stories about the young people we serve. READ THE CONSENT QUESTIONS
      CAREFULLY. The website will refuse to show a story that does not clear
      them, no matter what else is filled in.
  - name: stats
    label: Impact numbers
    files:
      - name: stats
        label: All impact numbers
        file: data/stats.json
        fields:
          - name: items
            label: Impact numbers
            label_singular: Number
            widget: list
            required: false
            collapsed: true
            add_to_top: true
            summary: '{{label}}: {{prefix}}{{value}}{{suffix}}'
            fields:
              - name: published
                label: Show this number
                widget: boolean
                default: false
              - name: order
                label: Position
                widget: number
                value_type: int
                required: false
                hint: 1 shows first, 2 second, and so on.
              - name: id
                label: Short name for this entry
                widget: string
                pattern:
                  - ^[a-z0-9-]+$
                  - Lowercase letters, numbers and dashes only
              - name: label
                label: What the number means
                widget: string
                hint: >-
                  Example: Awarded in scholarships. Keep it short — it sits
                  under the number.
              - name: value
                label: The number itself
                widget: number
                value_type: int
                required: false
                hint: >-
                  Digits only — no dollar sign, no commas, no plus. Write
                  7000, not $7,000+. The symbols go in the two boxes below.
                  Leave this EMPTY if the figure is not confirmed yet; the
                  website then simply does not show it, which is much better
                  than showing a guess.
              - name: prefix
                label: Symbol before the number
                widget: string
                required: false
                hint: Usually $ or nothing.
              - name: suffix
                label: Symbol after the number
                widget: string
                required: false
                hint: Usually + or % or nothing.
              - name: goal
                label: Goal (donation bar only)
                widget: number
                value_type: int
                required: false
                hint: >-
                  Only for the entry called campaign-goal. The bar needs BOTH
                  this and the raised amount above; if either is empty the bar
                  is hidden entirely.
              - name: source
                label: Where this number came from
                widget: string
                required: false
                hint: >-
                  Example: Counted from our 2026 scholarship files. If you
                  cannot say where it came from, it is not ready to publish.
              - name: verifiedOn
                label: Date you last checked it
                widget: datetime
                date_format: YYYY-MM-DD
                time_format: false
                picker_utc: false
                required: false
              - name: asOf
                label: As-of wording (donation bar only)
                widget: string
                required: false
                hint: 'Example: September 2026.'
    description: >-
      The figures on the Impact page, and the donation goal bar. Every number
      needs to be one we can prove.
  - name: programs
    label: Programs
    files:
      - name: programs
        label: All programs
        file: data/programs.json
        fields:
          - name: items
            label: Programs
            label_singular: Program
            widget: list
            required: false
            collapsed: true
            add_to_top: true
            summary: '{{name}}'
            fields:
              - name: published
                label: Show this on the website
                widget: boolean
                default: false
              - name: slug
                label: Web address name
                widget: string
                pattern:
                  - ^[a-z0-9-]+$
                  - Lowercase letters, numbers and dashes only
                hint: >-
                  Lowercase with dashes, e.g. future-stars. Changing this
                  breaks any link already shared.
              - name: name
                label: Program name
                widget: string
              - name: category
                label: Category
                widget: select
                options:
                  - Youth Development
                  - Sports & Recreation
                  - Community Support
                  - Education
                hint: >-
                  Must match one of these exactly. It decides which group the
                  program appears under.
              - name: shortDescription
                label: One-line summary
                widget: text
                hint: >-
                  One or two sentences that make sense on their own, on a
                  card.
              - name: summary
                label: Line under the title
                widget: text
                required: false
              - name: whatWeDo
                label: What we do
                widget: text
                required: false
                hint: Press Enter twice between paragraphs.
              - name: whoWeServe
                label: Who it is for
                widget: text
                required: false
              - name: eligibility
                label: Requirements to join
                widget: string
                required: false
              - name: ageRange
                label: Ages (as written)
                widget: string
                required: false
                hint: 'Example: Ages 9-16. This is the wording people read.'
              - name: ageMin
                label: Youngest age
                widget: number
                value_type: int
                required: false
                hint: Digits only. Used by the age filter, not shown as text.
              - name: ageMax
                label: Oldest age
                widget: number
                value_type: int
                required: false
              - name: schedule
                label: When it runs
                widget: string
                required: false
              - name: location
                label: Where it runs
                widget: string
                required: false
              - name: cost
                label: Cost
                widget: string
                required: false
                hint: >-
                  Write "Free" exactly if it is free — the website checks for
                  that word.
              - name: serviceArea
                label: Area served
                widget: string
                required: false
              - name: metaDescription
                label: Google search description
                widget: text
                required: false
              - name: hero
                label: Main photo
                widget: object
                required: false
                collapsed: false
                fields:
                  - name: src
                    label: Image file
                    widget: image
                    required: false
                  - name: alt
                    label: Describe this photo
                    widget: string
                    required: false
              - name: gallery
                label: More photos
                widget: list
                required: false
                collapsed: false
                fields:
                  - name: src
                    label: Image file
                    widget: image
                  - name: alt
                    label: Describe this photo
                    widget: string
              - name: impactStats
                label: Numbers for this program
                widget: list
                required: false
                fields:
                  - name: label
                    label: What it means
                    widget: string
                  - name: value
                    label: The number
                    widget: number
                    value_type: int
                    required: false
                    hint: >-
                      Leave empty if not confirmed. An empty one is simply not
                      shown.
                  - name: suffix
                    label: Symbol after
                    widget: string
                    required: false
              - name: ctaPrimary
                label: Main button
                widget: object
                required: false
                fields:
                  - name: text
                    label: Button wording
                    widget: string
                    required: false
                  - name: href
                    label: Where it goes
                    widget: string
                    required: false
              - name: ctaSecondary
                label: Second button
                widget: object
                required: false
                fields:
                  - name: text
                    label: Button wording
                    widget: string
                    required: false
                  - name: href
                    label: Where it goes
                    widget: string
                    required: false
  - name: sponsors
    label: Sponsors
    files:
      - name: sponsors
        label: All sponsors
        file: data/sponsors.json
        fields:
          - name: items
            label: Sponsors
            label_singular: Sponsor
            widget: list
            required: false
            collapsed: true
            add_to_top: true
            summary: '{{name}} ({{tier}})'
            fields:
              - name: published
                label: Show this sponsor
                widget: boolean
                default: false
              - name: id
                label: Short name for this entry
                widget: string
                pattern:
                  - ^[a-z0-9-]+$
                  - Lowercase letters, numbers and dashes only
              - name: name
                label: Business name
                widget: string
                hint: Exactly how they spell it, including any punctuation.
              - name: logo
                label: Their logo
                widget: object
                required: false
                collapsed: false
                fields:
                  - name: src
                    label: Logo file
                    widget: image
                    required: false
                    hint: >-
                      Ask them for a PNG or SVG with a transparent background.
                      Aim for about 400 pixels wide. Every logo sits in a box
                      of the same size, so a wide logo and a square one will
                      both look right. If all you have is a photo of a
                      business card, leave this empty — their name will show
                      as text, which looks far better than a blurry logo.
                  - name: alt
                    label: Describe this logo
                    widget: string
                    required: false
                    hint: 'Usually just: Acme Supply Co. logo.'
              - name: website
                label: Their website
                widget: string
                required: false
                pattern:
                  - ^$|^https?://
                  - Must start with https:// or be left empty
              - name: tier
                label: Sponsorship level
                widget: string
                required: false
              - name: sinceYear
                label: Sponsor since
                widget: number
                value_type: int
                required: false
    description: >-
      The logo wall on the Get Involved page. Only add a sponsor once the
      partnership is agreed in writing — a logo on our site is a public
      statement about someone else's business.
  - name: team
    label: Board & staff
    files:
      - name: team
        label: All board & staff
        file: data/team.json
        fields:
          - name: items
            label: Board & staff
            label_singular: Person
            widget: list
            required: false
            collapsed: true
            add_to_top: true
            summary: '{{name}} — {{role}}'
            fields:
              - name: published
                label: Show this person
                widget: boolean
                default: false
              - name: order
                label: Position in the list
                widget: number
                value_type: int
                required: false
              - name: id
                label: Short name for this entry
                widget: string
                pattern:
                  - ^[a-z0-9-]+$
                  - Lowercase letters, numbers and dashes only
              - name: name
                label: Full name
                widget: string
              - name: role
                label: Their role
                widget: string
                hint: 'Example: President & Founder, or Treasurer.'
              - name: boardMember
                label: Are they on the board?
                widget: boolean
                default: false
                hint: >-
                  ON puts them under "Board of Directors". OFF puts them under
                  "Staff & Key Volunteers". These are read very differently by
                  funders, so get it right.
              - name: bio
                label: Short biography
                widget: text
                required: false
                hint: >-
                  A few sentences. Ask the person to approve it before you
                  publish.
              - name: photo
                label: Their photo
                widget: object
                required: false
                collapsed: false
                fields:
                  - name: src
                    label: Image file
                    widget: image
                    required: false
                    hint: >-
                      A square headshot works best. If there isn't one, leave
                      it empty — their initials show instead, which looks
                      intentional.
                  - name: alt
                    label: Describe this photo
                    widget: string
                    required: false
    description: >-
      Shown on Where Your Money Goes. Grant reviewers look for named
      leadership, so keep this current.
  - name: resources
    label: Resources
    files:
      - name: resources
        label: All resources
        file: data/resources.json
        fields:
          - name: items
            label: Resources
            label_singular: Resource
            widget: list
            required: false
            collapsed: true
            add_to_top: true
            summary: '{{title}} ({{category}})'
            fields:
              - name: published
                label: Show this
                widget: boolean
                default: false
              - name: order
                label: Position in the list
                widget: number
                value_type: int
                required: false
              - name: id
                label: Short name for this entry
                widget: string
                pattern:
                  - ^[a-z0-9-]+$
                  - Lowercase letters, numbers and dashes only
              - name: title
                label: Name of the resource
                widget: string
              - name: category
                label: Which section
                widget: select
                options:
                  - Education
                  - Employment
                  - Community
                  - Governance
                  - Forms
                  - Scholarships
                hint: >-
                  Education, Employment and Community appear on the Resources
                  page. Governance appears on Where Your Money Goes instead.
              - name: description
                label: One-line description
                widget: text
                hint: What it is and who it helps, in one sentence.
              - name: organization
                label: Who runs it
                widget: string
                required: false
                hint: >-
                  The agency's name. The page says plainly that it is their
                  service and not ours, which is important — we are pointing
                  people on, not vouching.
              - name: phone
                label: Phone number
                widget: string
                required: false
                hint: >-
                  The single most useful thing on this page. Only enter a
                  number you have actually dialled. Never guess one — someone
                  in trouble will call it.
              - name: url
                label: Web address
                widget: string
                required: false
                pattern:
                  - ^$|^https?://|^assets/
                  - Must start with https:// or be a file path
                hint: >-
                  Leave empty for one of our own documents we have not
                  uploaded yet — the row then says "Coming soon" instead of
                  vanishing.
              - name: fileType
                label: What kind of thing is it
                widget: select
                options:
                  - Link
                  - PDF
                  - Form
                  - Phone
                required: false
              - name: external
                label: Is this someone else's website?
                widget: boolean
                default: true
                hint: ON opens it in a new tab and marks it as theirs, not ours.
    description: >-
      The help-for-families list, plus our own governance documents. Local
      phone numbers are what make this page worth keeping.
  - name: testimonials
    label: Testimonials
    files:
      - name: testimonials
        label: All testimonials
        file: data/testimonials.json
        fields:
          - name: items
            label: Testimonials
            label_singular: Testimonial
            widget: list
            required: false
            collapsed: true
            add_to_top: true
            summary: '{{name}} — {{role}}'
            fields:
              - name: published
                label: Show this
                widget: boolean
                default: false
              - name: order
                label: Position
                widget: number
                value_type: int
